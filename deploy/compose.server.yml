# ── Backend service (mode-agnostic bits) ─────────────────────────────────────
# The build/command differ by mode and come from compose.server.dev.yml /
# .prod.yml. Port publishing is NOT here — it lives in compose.publish.yml,
# included only when no reverse proxy fronts the apps (a proxy reaches `server`
# over the compose network instead).
services:
  server:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-joust}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joust}?schema=public
      # Backend refuses to boot without this (server/src/config/security.config.ts).
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # NODE_ENV=production gates the Secure cookie + enforced CORS allowlist.
      # setup.sh sets these three in .env per the chosen mode/exposure; the
      # defaults here keep a bare `local` stack working.
      - NODE_ENV=${NODE_ENV:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SOCKET_ALLOWED_ORIGINS=${SOCKET_ALLOWED_ORIGINS:-}
      - HOST_IP=${HOST_IP:-localhost}
    # main.ts serves uploads from <cwd>/../images; the container runs in /app so
    # that resolves to /images. Bind the deploy-root images/ dir there. The path
    # is an ABSOLUTE var (set in .env by setup.sh) so the fragment can live inside
    # the backend repo — a relative ./images would resolve against THIS file's
    # dir, not the deploy root. Fallback keeps an in-root checkout working.
    volumes:
      - ${JOUST_IMAGES_DIR:-./images}:/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
