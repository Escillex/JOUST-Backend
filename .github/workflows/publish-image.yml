# ─────────────────────────────────────────────────────────────────────────────
# Builds deploy/Dockerfile.prod and pushes it to GHCR as
# ghcr.io/escillex/joust-backend — the image deploy/release/compose.yml pulls.
#
# `latest` moves with main. A `v*` tag also publishes the exact version, which
# is what a deployment should pin (JOUST_VERSION in its .env).
# ─────────────────────────────────────────────────────────────────────────────
name: Publish backend image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # One build per ref; a new push cancels an in-flight one for the same branch.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/escillex/joust-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated. The backend leg is the slow one — bcrypt has no
      # prebuilt musl binary, so node-gyp compiles it under QEMU. If that
      # becomes intolerable, drop linux/arm64 from `platforms` below; amd64
      # alone covers every ordinary VPS.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by GitHub; `packages: write` above is what makes it usable.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
